<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
    <defs>
        <style>
            .text { font-family: Arial, sans-serif; font-weight: 900; font-size: 32px; fill: #FFFFFF; letter-spacing: 3px; }
            .text-red { fill: #C8102E; }
            .circle { fill: #C8102E; }
            .letter { fill: #FFFFFF; font-family: Arial, sans-serif; font-weight: 900; font-size: 28px; }
        </style>
    </defs>
    
    <!-- Circle -->
    <circle cx="30" cy="30" r="28" class="circle"/>
    
    <!-- Letter U -->
    <text x="18" y="44" class="letter">U</text>
    
    <!-- Text -->
    <text x="68" y="38" class="text">UNPLAYED</text>
</svg>